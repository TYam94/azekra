# Copy this file to config.toml and edit it. config.toml is not tracked by git.

[lmstudio]
base_url  = "http://localhost:1234/v1"
api_key   = "lm-studio"
llm       = "google/gemma-4-e2b"
embedding = "text-embedding-embeddinggemma-300m-qat"

[PubMed]
email   = ""   # Recommended by NCBI E-utilities (warning if empty)
api_key = ""   # Optional. Raises the rate limit when given

# Relative paths are resolved from the directory of this file.
[paths]
PubMed_abstracts = "data/db_PubMed/PMID_abstracts.json"
PubMed_chroma    = "data/db_PubMed/Chroma"
Zotero_temp      = "data/_temp"
threads          = "data/threads"
litres_input     = "data/user/litres_sample.toml"   # Default input of 001_literature.py

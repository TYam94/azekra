# Input of code/001_literature.py
# Text between ''' and ''' is used as is (no escaping needed).

# Research context: what you are working on. Used for both PubMed search and writing.
research_context = '''
関節リウマチの難治性についての遺伝的素因を明らかにし、精密医療を実現したい。
'''

# Request: what the LLM should write, based on the collected literature.
request = '''
提示されている研究テーマについて、10件程度の文献を参照しつつ、かんたんに既知の知見をまとめて教えてください。
'''

# Literature that must be cited, by PMID (optional).
# Ones not stored yet are fetched from PubMed. They are passed to the LLM directly, not through search.
must_cite = ["36333501"]

# Minimum number of literatures to be found by search before the answer is accepted (optional; default 20).
# Must-cite ones are not counted. If the LLM answers with fewer, it is sent back to search more (up to 3 times).
# litres_n_minimum = 30

# Publishers to exclude from literature search, by DOI prefix (optional).
# Articles without DOI are not excluded.
exclude_doi_prefixes = ["10.3390"]   # DOI prefix: the part before "/" (e.g. "10.1234" in "10.1234/abc.567")
